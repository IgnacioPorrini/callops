<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>QTL — Editor de colas</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:      #0a0a0f;
      --surface: #12121a;
      --surface2:#1c1c28;
      --border:  #2a2a3d;
      --accent:  #ff4d6d;
      --accent2: #7b61ff;
      --text:    #e8e8f0;
      --muted:   #6b6b85;
      --success: #00d68f;
      --warn:    #ffaa00;
      --mono: "Space Mono", monospace;
      --sans: "Syne", sans-serif;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      min-height: 100vh;
    }

    /* ── Header fijo ── */
    .editor-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      height: 58px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .editor-header::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
    }
    .header-logo {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--mono);
      font-weight: 700; font-size: 11px;
      color: white; flex-shrink: 0;
    }
    .header-title {
      font-size: 14px; font-weight: 800;
      letter-spacing: -0.2px;
      flex: 1;
    }
    .header-title span {
      display: block;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 400;
      color: var(--muted);
      margin-top: 1px;
    }
    .btn-save {
      padding: 9px 22px;
      background: var(--accent2);
      border: none;
      border-radius: 8px;
      color: white;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: filter 0.15s;
      letter-spacing: 0.03em;
      flex-shrink: 0;
    }
    .btn-save:hover { filter: brightness(1.12); }
    .btn-save.saved { background: var(--success); }

    /* ── Main scrollable ── */
    .editor-main {
      max-width: 960px;
      margin: 0 auto;
      padding: 78px 32px 60px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ── Intro strip ── */
    .editor-intro {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      line-height: 1.6;
    }
    .editor-intro strong { color: var(--text); }

    /* ── Queue cards ── */
    .queue-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .queue-card:focus-within { border-color: rgba(123,97,255,0.35); }

    .queue-card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
    }
    .queue-num {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      flex-shrink: 0;
      min-width: 28px;
    }
    .queue-name-input {
      flex: 1;
      background: transparent;
      border: none;
      border-bottom: 1px solid transparent;
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 700;
      outline: none;
      padding: 2px 0;
      transition: border-color 0.15s;
    }
    .queue-name-input:focus { border-bottom-color: var(--accent2); }
    .queue-name-input::placeholder { color: var(--muted); font-weight: 400; }

    .del-queue-btn {
      padding: 5px 12px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .del-queue-btn:hover { color: var(--accent); border-color: rgba(255,77,109,0.3); background: rgba(255,77,109,0.06); }

    /* ── Tabs ── */
    .queue-card-body {
      padding: 12px 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .col-labels {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2px;
    }
    .col-lbl {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .col-lbl.lbl-title  { flex: 1; }
    .col-lbl.lbl-url    { flex: 2.5; }
    .col-lbl.lbl-active { width: 44px; text-align: center; flex-shrink: 0; }
    .col-lbl.lbl-del    { width: 28px; flex-shrink: 0; }

    .tab-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .tab-input {
      padding: 7px 11px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 11px;
      outline: none;
      transition: border-color 0.15s;
      min-width: 0;
    }
    .tab-input:focus { border-color: var(--accent2); }
    .tab-input::placeholder { color: var(--muted); }
    .title-input { flex: 1; }
    .url-input   { flex: 2.5; }

    .active-wrap {
      width: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
    }
    .active-wrap input[type="checkbox"] {
      width: 16px; height: 16px;
      cursor: pointer;
      accent-color: var(--accent2);
    }
    .tab-del-btn {
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 5px;
      color: var(--muted);
      font-size: 11px;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s;
      padding: 0;
    }
    .tab-del-btn:hover { color: var(--accent); border-color: rgba(255,77,109,0.3); }

    .add-tab-btn {
      width: 100%;
      padding: 7px;
      border: 1px dashed var(--border);
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
      cursor: pointer;
      transition: all 0.15s;
      margin-top: 4px;
    }
    .add-tab-btn:hover { border-color: var(--accent2); color: var(--accent2); }

    /* ── Add queue ── */
    .add-queue-btn {
      width: 100%;
      padding: 12px;
      border: 1.5px dashed var(--border);
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
      margin-top: 2px;
    }
    .add-queue-btn:hover { border-color: var(--accent2); color: var(--accent2); background: rgba(123,97,255,0.04); }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 20px;
      font-size: 11px;
      font-family: var(--mono);
      color: var(--text);
      opacity: 0;
      transition: all 0.25s;
      pointer-events: none;
      white-space: nowrap;
      z-index: 999;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.ok   { border-color: var(--success); color: var(--success); }
    #toast.err  { border-color: var(--accent);  color: var(--accent);  }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 12px;
      line-height: 2;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  </style>
</head>
<body>

  <header class="editor-header">
    <div class="header-logo">QL</div>
    <div class="header-title">
      Editor de colas
      <span>Queue Tab Launcher · configuración de colas y pestañas</span>
    </div>
    <button class="btn-save" id="btnSave">✓ Guardar cambios</button>
  </header>

  <main class="editor-main">

    <div class="editor-intro">
      <strong>Título</strong> es el nombre que se muestra en el banner y en Call Notes.
      <strong>URL</strong> es la dirección que se abre al recibir esa cola.
      <strong>Foco</strong> indica qué pestaña queda activa al abrirse.
    </div>

    <div id="queueList"></div>

    <button class="add-queue-btn" id="btnAddQueue">+ Agregar cola</button>

  </main>

  <div id="toast"></div>
  <script src="src/editor.js"></script>
</body>
</html>
